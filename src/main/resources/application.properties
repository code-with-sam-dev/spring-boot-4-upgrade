spring.application.name=orders

spring.datasource.url=jdbc:postgresql://localhost:5442/orders
spring.datasource.username=orders
spring.datasource.password=orders

spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# With --spring.profiles.active=local-stub this app serves a
# stand-in payments service; otherwise point this at the
# real one.
payments.base-url=http://localhost:${server.port:8080}

server.error.include-message=always

spring.mvc.apiversion.use.header=X-Version
spring.mvc.apiversion.default=1
